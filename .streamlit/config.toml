# Tema visual de FactuSnap — verde agro profesional.
# Streamlit aplica estos colores a TODA la app automaticamente.
[theme]
primaryColor = "#2E7D32"             # verde principal (botones, acentos)
backgroundColor = "#FFFFFF"          # fondo blanco
secondaryBackgroundColor = "#EEF5EC" # verde muy claro (barra lateral, tarjetas)
textColor = "#1B2A1B"                # texto verde-oscuro casi negro
font = "sans serif"
